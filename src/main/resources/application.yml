spring:
  application:
    name: bofit
  profiles:
    group:
      local: local-db, local-port, common
      dev-blue: common, dev-db, dev-blue-port
      dev-green: common, dev-db, dev-green-port
      prod: prod-db, prod-port, common
    active: local

---
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: bofit-bucket
    stack:
      auto: false
spring:
  config:
    activate:
      on-profile: common
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        highlight_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
kakao:
  authorization-uri: https://kauth.kakao.com/oauth/authorize
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
jwt:
  secret: ${JWT_SECRET}
  accessTokenExpiration: ${ACCESS_EXPIRED_AT}
  refreshTokenExpiration: ${REFRESH_EXPIRED_AT}
openai:
  secret-key: ${OPEN_AI_KEY}
  model: ${OPEN_AI_MODEL}
  max-tokens: ${OPEN_AI_MAX_TOKEN}
  temperature: ${OPEN_AI_TEMPERATURE}
  base-url: https://api.openai.com/v1
server:
  forward-headers-strategy: FRAMEWORK

resilience4j.retry:
  instances:
    LLMRetry:
      maxAttempts: 3
      waitDuration: 1s
      enableExponentialBackoff: true
      exponentialBackoffMultiplier: 2.5
      retryExceptions:
        - java.io.IOException
        - org.sopt.bofit.global.exception.customexception.InternalException
        - org.sopt.bofit.global.exception.customexception.CustomException

management:
  endpoints:
    web:
      exposure:
        include: prometheus, openapi, swagger, health, metrics, info
  metrics:
    tags:
      application: bofit-server # 메트릭에 애플리케이션 이름 태그 추가
  endpoint:
    prometheus:
      enabled: true
    health:
      enabled: true
      show-details: always
#      show-details: when-authorized


---
spring:
  config:
    activate:
      on-profile: local-db
  jpa:
    hibernate:
      ddl-auto: ${LOCAL_DATASOURCE_DDL_AUTO}
  datasource:
    url: ${LOCAL_DATASOURCE_URL}
    username: ${LOCAL_DATASOURCE_USERNAME}
    password: ${LOCAL_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
---
spring:
  config:
    activate:
      on-profile: local-port
server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: dev-db
  jpa:
    hibernate:
      ddl-auto: ${DEV_DATASOURCE_DDL_AUTO}
  datasource:
    url: ${DEV_DATASOURCE_URL}
    username: ${DEV_DATASOURCE_USERNAME}
    password: ${DEV_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}

---
spring:
  config:
    activate:
      on-profile: dev-port
server:
  port: 8081

---
spring:
  config:
    activate:
      on-profile: dev-blue-port
server:
  port: 8080


---
spring:
  config:
    activate:
      on-profile: dev-green-port
server:
  port: 8081

---
spring:
  config:
    activate:
      on-profile: prod-db
  jpa:
    hibernate:
      ddl-auto: ${PROD_DATASOURCE_DDL_AUTO}
  datasource:
    url: ${PROD_DATASOURCE_URL}
    username: ${PROD_DATASOURCE_USERNAME}
    password: ${PROD_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

---
spring:
  config:
    activate:
      on-profile: prod-port
server:
  port: 8082