spring:
  config:
    activate:
      on-profile: test

  cache:
    type: none

  datasource:
    url: jdbc:h2:mem:testdb;NON_KEYWORDS=USER;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: test
    password: test

  h2:
    console:
      enabled: true

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        hbm2ddl:
          auto: create-drop
    open-in-view: false

jwt:
  secret: testSecretKeyForJwtWhichIsAtLeast32Bytes~~~
  accessTokenExpiration: 3600000
  refreshTokenExpiration: 604800000

openai:
  secret-key: test-key
  model: test-gpt-model
  max-tokens: 1000
  temperature: 0.7

kakao:
  client-id: test-client-id
  redirect-uri: http://localhost:8080/test