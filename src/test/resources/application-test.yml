spring:
  config:
    activate:
      on-profile: test

  cache:
    type: none

  datasource:
    url: jdbc:h2:mem:testdb;NON_KEYWORDS=USER;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: test
    password: test

  h2:
    console:
      enabled: true

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        hbm2ddl:
          auto: create-drop
    open-in-view: false

jwt:
  secret: testSecretKeyForJwtWhichIsAtLeast32Bytes~~~
  accessTokenExpiration: 3600000
  refreshTokenExpiration: 604800000

scheduler:
  trend-posts-update-delay: 60000

openai:
  secret-key: test-key
  model: test-gpt-model
  max-tokens: 1000
  temperature: 0.7

kakao:
  client-id: test-client-id
  admin-key: test-admin-key
  redirect-uri: http://localhost:8080/test
  logout-uri: https://kauth.kakao.com/oauth/logout
  unlink-uri: https://kapi.kakao.com/v1/user/unlink

cloud:
  aws:
    credentials:
      access-key: test
      secret-key: test
    region:
      static: ap-northeast-2
    s3:
      bucket: bofit-bucket
    stack:
      auto: false
message-broker:
  sqs:
    generative-ai: "test-queue-url"